<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALKHORA Team Inbox</title>
<style>
	:root {
		--navy: #0a1b33; --navy-mid: #17416a; --navy-deep: #050d1e;
		--blue: #2e6be6; --ink: #0b1220; --muted: #5b6b80;
		--paper: #f6f8fb; --surface: #ffffff; --line: #e2e8f0;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; }
	body {
		display: flex; align-items: center; justify-content: center; padding: 16px;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "IBM Plex Sans Arabic", sans-serif;
		color: var(--ink);
		background: radial-gradient(circle at 50% 0%, var(--navy-mid), var(--navy) 55%, var(--navy-deep));
	}
	.card {
		width: 100%; max-width: 420px; padding: 32px 28px; text-align: center;
		background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
		box-shadow: 0 20px 40px rgba(5, 13, 30, 0.35);
	}
	h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
	p { margin: 0 0 24px; color: var(--muted); font-size: 15px; line-height: 1.5; }
	a.btn {
		display: inline-block; padding: 10px 20px; border-radius: 10px;
		background: var(--blue); color: #fff; text-decoration: none; font-weight: 600;
	}
	a.btn:hover, a.btn:focus-visible { background: #2558c4; }
</style>
</head>
<body>
	<main class="card">
		<h1>Team Inbox</h1>
		<p>The Team Inbox web build has not been deployed yet.</p>
		<a class="btn" href="/app">Back to ERPNext</a>
	</main>
</body>
</html>
