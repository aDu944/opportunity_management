<!DOCTYPE html>
<html>
<head>
  <!-- Served from /assets/opportunity_management/inbox/ (set by
       `flutter build web --base-href …`, see tool/build_inbox_web.sh). -->
  <base href="/assets/opportunity_management/inbox/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ALKHORA ESS — WhatsApp and Messenger team inbox.">
  <meta name="theme-color" content="#0E2647">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Team Inbox">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- The app bundles IBM Plex Sans Arabic; this covers the HTML loading
       text and the browser's own UI (notifications, dialogs). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">

  <title>ALKHORA Team Inbox</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0E2647; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center;
      font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; color: #CFE0FB; }
    #boot img { width: 56px; height: 56px; border-radius: 14px; display: block; margin: 0 auto 14px; }
  </style>
</head>
<body>
  <div id="boot"><div><img src="icons/Icon-192.png" alt=""><div>ALKHORA Team Inbox</div></div></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
