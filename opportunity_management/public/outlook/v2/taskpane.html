<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERPNext Opportunities</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <main id="app">
    <section id="view-loading" class="view">
      <p class="muted">Loading&hellip;</p>
    </section>

    <section id="view-signin" class="view" hidden>
      <div class="card center">
        <img src="icon-64.png" alt="" width="40" height="40">
        <h1>ERPNext Opportunities</h1>
        <p class="muted">Sign in with your ERPNext account to link this email to an Opportunity.</p>
        <button id="btn-signin" class="primary">Sign in to ERPNext</button>
      </div>
    </section>

    <section id="view-noitem" class="view" hidden>
      <p class="muted">Open an email to see its Opportunities.</p>
    </section>

    <section id="view-email" class="view" hidden>
      <div class="card email">
        <div class="email-dir" id="email-dir"></div>
        <div class="email-subject" id="email-subject"></div>
      </div>

      <div id="linked-block" hidden>
        <h2>Linked to</h2>
        <ul class="opps" id="linked"></ul>
      </div>

      <div id="attach-block" class="card attach" hidden>
        <label class="check">
          <input type="checkbox" id="attach-toggle" checked>
          <span id="attach-label"></span>
        </label>
        <ul class="attach-list" id="attach-list"></ul>
      </div>

      <div id="suggest-block" hidden>
        <h2>Suggested</h2>
        <ul class="opps" id="suggestions"></ul>
      </div>
      <p id="no-suggestions" class="muted small" hidden>No matching Opportunities for these addresses. Search below.</p>

      <h2>Search</h2>
      <input type="search" id="search" placeholder="Opportunity no., customer, tender, INQ&hellip;" autocomplete="off">
      <ul class="opps" id="results"></ul>
      <p id="search-empty" class="muted small" hidden>Nothing found.</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer>
    <span id="who" class="muted small"></span>
    <span>
      <button id="btn-reload" class="link" title="Reload">Reload</button>
      <button id="btn-signout" class="link" hidden>Sign out</button>
    </span>
  </footer>

  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
